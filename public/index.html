    <script>
      (function () {
        var ID = 'G-P9VRVWW9YJ';
        var params = null;
        try { params = new URLSearchParams(window.location.search); } catch (e) {}

        // 1) Don't count my own visits: open the site once with ?me=1 on each device (?me=0 undoes it).
        try {
          if (params && params.get('me') === '1') localStorage.setItem('jm_owner', '1');
          if (params && params.get('me') === '0') localStorage.removeItem('jm_owner');
          if (localStorage.getItem('jm_owner') === '1') window['ga-disable-' + ID] = true;
        } catch (e) {}

        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());

        // 2) Short personal links: www.jinalmandalia.com/?r=amazon shows up in GA as source "amazon".
        var cfg = {};
        var ref = params && (params.get('r') || params.get('ref'));
        if (ref && !params.get('utm_source')) {
          ref = ref.toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 60);
          if (ref) {
            cfg.page_location = window.location.origin + window.location.pathname +
              '?utm_source=' + encodeURIComponent(ref) + '&utm_medium=personal_link&utm_campaign=job_search';
          }
        }
        gtag('config', ID, cfg);
        if (ref) gtag('event', 'personal_link_visit', { ref: ref });

        // Keep the address bar clean for the visitor.
        if (params && (params.has('r') || params.has('ref') || params.has('me'))) {
          try {
            params.delete('r'); params.delete('ref'); params.delete('me');
            var q = params.toString();
            window.history.replaceState(null, '', window.location.pathname + (q ? '?' + q : '') + window.location.hash);
          } catch (e) {}
        }
      })();
